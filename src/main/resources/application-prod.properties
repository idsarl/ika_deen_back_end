# Configuration de Production
spring.application.name=ika-deen-backend
server.port=80

# MongoDB Configuration (Atlas/Cloud)
# spring.data.mongodb.uri=mongodb+srv://${MONGO_USER}:${MONGO_PWD}@cluster.mongodb.net/ika_deen_prod
spring.data.mongodb.auto-index-creation=false

# Security
spring.ssl.bundle.jks.mybundle.key.alias=selfsigned
server.forward-headers-strategy=native

# Logging
logging.level.ika_deen.back_end=INFO
logging.level.org.springframework.web=WARN
