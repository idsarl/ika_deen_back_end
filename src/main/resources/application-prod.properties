# Configuration de Production
spring.application.name=ika-deen-backend
server.port=${PORT:80}

# MongoDB Configuration (Atlas/Cloud)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:ika_deen}
spring.data.mongodb.auto-index-creation=false

# JWT Configuration
ika-deen.jwt.secret=${IKA_DEEN_JWT_SECRET}
ika-deen.jwt.expiration=86400000

# Admin Configuration
ika-deen.admin.email=${IKA_DEEN_ADMIN_EMAIL}
ika-deen.admin.password=${IKA_DEEN_ADMIN_PASSWORD}

# Security
spring.ssl.bundle.jks.mybundle.key.alias=selfsigned
server.forward-headers-strategy=native

# Logging
logging.level.ika_deen.back_end=INFO
logging.level.org.springframework.web=WARN
