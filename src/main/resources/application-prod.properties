# Configuration de Production
spring.application.name=ika-deen-backend
server.port=${PORT:8080}

# MongoDB Configuration (Atlas/Cloud)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:ika_deen}
spring.data.mongodb.auto-index-creation=false

# JWT Configuration
ika-deen.jwt.secret=${IKA_DEEN_JWT_SECRET}
ika-deen.jwt.expiration=86400000

# Admin Configuration
ika-deen.admin.email=${IKA_DEEN_ADMIN_EMAIL}
ika-deen.admin.password=${IKA_DEEN_ADMIN_PASSWORD}

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security
spring.ssl.bundle.jks.mybundle.key.alias=selfsigned
server.forward-headers-strategy=native

# Logging
logging.level.ika_deen.back_end=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# CORS Configuration - Production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://app.ikadeen.com,https://www.ikadeen.com}
cors.max-age=86400

# Upload
file.upload-dir=${FILE_UPLOAD_DIR:/var/uploads}

# Actuator - Production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
